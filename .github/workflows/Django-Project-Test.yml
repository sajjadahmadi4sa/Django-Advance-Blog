
name: Django Project Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Compose
        run: docker compose up -d --build

      - name: Run Tests
        run: docker compose exec -T backend sh -c "cd /app && flake8 && pytest ."

      - name: Stop Containers
        if: always()
        run: docker compose down
